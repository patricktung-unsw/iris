# bin/check on every push and pull request: the shipping greps, shellcheck,
# actionlint, ruff and the Python tests, the synthetic-dataset test among them, each
# run on CPU in the container its form pins, with no network and two
# minutes for each workflow's tests (bin/envrun, through Docker here). On a
# pull request it also checks the run proofs of the workflows the PR
# changes (bin/run-proof --check, which reads GITHUB_EVENT_NAME and
# GITHUB_BASE_REF and compares with origin/<base>); on a push it doesn't.
# When a pull request's run passes, the ready workflow (ready.yml) labels
# the PR ready; this one's token can't, since a fork's is read-only.
name: check
on: [push, pull_request]

permissions:
  contents: read
  packages: read  # the environment containers, private until an org owner makes them public

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # bin/check reads every commit message
      - uses: astral-sh/setup-uv@v10.3.0  # no major tags since v8; bin/check runs ruff, shellcheck and actionlint with uvx
      # A container is about 9 GB unpacked; the runner starts with less free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: bin/check
