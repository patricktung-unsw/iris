# Environment containers (ADR-0008, envs/README.md). Every version that
# lib/katana.sh's digest map lists as unpublished is built from its recipe
# in envs/, as a layer or fresh as envs/build-kind.sh decides (ADR-0010),
# checked by envs/check-container.sh the same way for either kind, and
# published by envs/publish-container.sh: on unsw-restech/iris's main to
# ghcr.io/unsw-restech/iris-env, and on any branch of a workflow author's
# fork to their own account's ghcr.io/<owner>/iris-env (#138), tagged
# <env>-<n>. GHCR starts a new package as private, which needs no org
# owner. The run's summary prints the digest line to put in lib/katana.sh
# in place of unpublished; once it is there, no later run builds that
# version again. On any other branch of unsw-restech/iris the same build
# and checks run, and nothing is published. Nothing builds on Katana.
name: containers
on:
  push:
    paths:
      - envs/**
      - lib/katana.sh
      - .github/workflows/containers.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        name: Unpublished versions
        shell: bash
        run: |
          . lib/katana.sh
          versions=$(for v in "${!IRIS_ENV_DIGESTS[@]}"; do
              [ "${IRIS_ENV_DIGESTS[$v]}" != unpublished ] || echo "$v"
          done | sort | jq -Rnc '[inputs]')
          echo "Unpublished: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  container:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1  # a version built as a layer builds on the one before it
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ matrix.version }}
      LOCAL: iris-env-build:local
    steps:
      - uses: actions/checkout@v7
      # The container is about 9 GB unpacked; the runner starts with less free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # A version built as a layer pulls the one before it, which may be private.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: envs/build-container.sh "$VERSION" "$LOCAL"
      - name: Size
        run: docker images "$LOCAL"
      - name: Install Xvfb
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - name: Check against the recipe
        run: |
          Xvfb :99 -ac -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 envs/check-container.sh "$LOCAL" "$VERSION"
      # On unsw-restech/iris, main publishes to the org's package; on a
      # fork, every branch publishes to its owner's (envs/publish-container.sh).
      - name: Publish
        if: github.ref == 'refs/heads/main' || github.repository != 'unsw-restech/iris'
        run: envs/publish-container.sh "$LOCAL" "$VERSION"
