# Mentions the workflow owner of each workflow folder a pull request
# touches, read from that folder's manifest.yml, so an owner without write
# access to the repo still hears of it (#136). bin/owner-mentions writes the
# comment and says whom it leaves out.
#
# pull_request_target, so a PR from a fork gets a token that can comment.
# That token can write, so this never checks out or runs the PR's code:
# it checks out the PR's base and reads the PR's changed paths and earlier
# comments through the API.
name: owner-mention
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  mention:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Mention the owners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > "$RUNNER_TEMP/earlier"
          bin/owner-mentions "$AUTHOR" "$RUNNER_TEMP/earlier" < "$RUNNER_TEMP/paths" > "$RUNNER_TEMP/comment"
          if [ -s "$RUNNER_TEMP/comment" ]; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment"
          fi
